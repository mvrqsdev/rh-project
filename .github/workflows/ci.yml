# CI: roda em todo push para a main e em todo Pull Request.
# Para BLOQUEAR merge com erro: Settings → Rules → Rulesets → proteger a main
# → "Require status checks to pass" → selecionar o check "Lint".
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo PR/branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Hooks do husky não fazem sentido no CI.
      HUSKY: 0
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint
